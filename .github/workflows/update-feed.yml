name: Update Tumblr RSS Feed

on:
  
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  update-feed:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --disable-pip-version-check -r requirements.txt

      - name: Generate RSS feed
        run: |
          python fetch.py

      - name: Show generated feed
        run: |
          echo "===== FEED PREVIEW ====="
          head -100 site/feed.xml
          echo "========================"

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site/feed.xml
          git add site/index.html
          git add posts.json
          git add tumblr_debug.html
          git add search_state.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Tumblr RSS feed"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
